# Sanitized from the completed seed-42 ImperfectPour Edge/Cloud FT configuration.
model_name_or_path: ${ROBOSENSE_MODEL}
trust_remote_code: true
video_max_pixels: 16384
video_min_pixels: 3136
video_fps: 1.0
video_maxlen: 32
use_audio_in_video: false
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
additional_target: visual.merger
freeze_vision_tower: true
freeze_multi_modal_projector: false
dataset: imperfectpour_seen_train
eval_dataset: imperfectpour_seen_val
dataset_dir: ${ROBOSENSE_DATASET_DIR}
template: qwen2_omni
cutoff_len: 4096
overwrite_cache: false
preprocessing_num_workers: 2
dataloader_num_workers: 0
output_dir: ${ROBOSENSE_RUN_DIR}
logging_steps: 10
eval_strategy: steps
eval_steps: 50
save_steps: 50
save_total_limit: 6
load_best_model_at_end: true
metric_for_best_model: eval_anomaly_auprc
greater_is_better: true
plot_loss: true
overwrite_output_dir: true
report_to: none
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
use_reentrant_gc: false
sensor_fusion: true
sensor_token: <|fim_pad|>
sensor_num_tokens: 8
sensor_input_dim: 44
sensor_hidden_dim: 256
sensor_temporal_stride: 4
sensor_dropout_probability: 0.2
sensor_loss_weight: 0.5
multimodal_auxiliary_head: false
anomaly_head: true
anomaly_loss_weight: 1.0
distillation_loss_weight: 0.0
remove_unused_columns: false
seed: 42
max_grad_norm: 1.0
task_aware_head: true
export_task_outputs: true
num_task_labels: 6
num_action_labels: 4
num_object_labels: 3
task_embedding_dim: 256
task_loss_weight: 0.2
action_loss_weight: 0.1
object_loss_weight: 0.1
relation_distillation_loss_weight: 0.0

